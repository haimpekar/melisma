name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships an Android SDK but not necessarily the platform this
      # project compiles against, and AGP will not fetch it on its own.
      - name: Install the Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # A release build here too, so R8 and the resource shrinker are exercised on every
      # push rather than only when a tag is cut. It is unsigned: no secrets are needed and
      # none are exposed to pull requests.
      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease :fakeplayer:assembleDebug

      - name: Assert no sensitive service or installer manifest entries (Spotify experiment)
        if: github.head_ref == 'experiment/spotify-broadcast-no-notification-access'
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/melisma-manifest-dump.txt
          if grep -E 'BIND_NOTIFICATION_LISTENER_SERVICE|NotificationListenerService|REQUEST_INSTALL_PACKAGES|UPDATE_PACKAGES_WITHOUT_USER_ACTION|ShizukuProvider' /tmp/melisma-manifest-dump.txt; then
            echo "Unexpected sensitive permission or component in no-notification test build" >&2
            exit 1
          fi
          echo "Verified: zero notification-listener or self-installer entries in merged APK manifest"

      # Test-only APK, never a production signing key. Keep alongside a checksum.
      - name: Checksum test APK
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: melisma-visibility-debug-test-only
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7
